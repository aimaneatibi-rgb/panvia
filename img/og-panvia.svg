<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Panvia deelbeeld voor Instagram / Facebook / WhatsApp (1200×630).
       Exporteer dit als og-panvia.png in dezelfde map — social platforms
       tonen geen SVG. -->
  <defs>
    <pattern id="raster" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="#2438D8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F2F0E9"/>
  <rect width="1200" height="630" fill="url(#raster)"/>

  <!-- Merkteken: de plattegrond met de open hoek -->
  <g transform="translate(80 76) scale(1.6)">
    <path d="M21 3 H3 V29 H29 V11" fill="none" stroke="#2438D8" stroke-width="3"/>
    <path d="M10 22 L23 9" fill="none" stroke="#2438D8" stroke-width="3"/>
    <circle cx="24.5" cy="7.5" r="3.5" fill="#2438D8"/>
  </g>
  <text x="146" y="118" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="38" fill="#0E1230">Panvia</text>

  <!-- Kernboodschap -->
  <text x="80" y="272" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="82" fill="#0E1230">Vastgoed in</text>
  <text x="80" y="358" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="82" font-style="italic" fill="#2438D8">eigen hand.</text>

  <text x="80" y="428" font-family="'Instrument Sans', Helvetica, Arial, sans-serif" font-size="27" fill="#575E7B">Verkoop je woning, bedrijfspand of vakantiewoning zelf.</text>
  <text x="80" y="466" font-family="'Instrument Sans', Helvetica, Arial, sans-serif" font-size="27" fill="#575E7B">Rechtstreeks contact met kopers. Geen makelaar, geen courtage.</text>

  <!-- Prijsbalk -->
  <line x1="80" y1="516" x2="1120" y2="516" stroke="#E3E0D5" stroke-width="1"/>
  <text x="80" y="570" font-family="'IBM Plex Mono', Consolas, monospace" font-weight="500" font-size="44" fill="#2438D8">€ 895</text>
  <text x="228" y="570" font-family="'IBM Plex Mono', Consolas, monospace" font-size="19" fill="#575E7B">PER PLAATSING VAN 6 MAANDEN, INCL. BTW</text>
  <text x="1120" y="570" text-anchor="end" font-family="'IBM Plex Mono', Consolas, monospace" font-size="19" fill="#575E7B">PANVIA.NL</text>
</svg>
